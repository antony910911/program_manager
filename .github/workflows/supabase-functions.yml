# Deploys the calendar sync function (supabase/functions/calendar) to the Supabase project in
# .env.production, and hands it the calendar sign-in settings stored as repository secrets.
# One-time setup: DEPLOY.md「連接行事曆」. Without SUPABASE_ACCESS_TOKEN this workflow does nothing.
name: Deploy calendar function

on:
  push:
    branches: [main, claude/trello-premium-project-tool-4qoyji]
    paths: ['supabase/functions/**', '.github/workflows/supabase-functions.yml']
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_TENANT: ${{ secrets.MS_TENANT }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Supabase isn't set up for deploys yet
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret not set; see DEPLOY.md「連接行事曆」. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          ref=$(grep '^VITE_SUPABASE_URL=' .env.production | sed -E 's#.*https://([^.]+)\..*#\1#')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - name: Pass calendar settings to the function
        if: steps.check.outputs.skip != 'true'
        run: |
          args=()
          for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET MS_CLIENT_ID MS_CLIENT_SECRET MS_TENANT; do
            v="${!k}"
            if [ -n "$v" ]; then args+=("$k=$v"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "${{ steps.check.outputs.ref }}" "${args[@]}"; fi
      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy calendar --project-ref "${{ steps.check.outputs.ref }}" --use-api --no-verify-jwt
