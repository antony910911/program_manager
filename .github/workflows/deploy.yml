# Builds the site and publishes it to GitHub Pages on every push to the default branch.
# One-time setup (see DEPLOY.md): Settings → Pages → Source: GitHub Actions.
# Supabase settings come from .env.production (public values); repository variables of the same
# name, if set, take precedence.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/trello-premium-project-tool-4qoyji]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use repository variables when set
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ]; then echo "VITE_SUPABASE_URL=$URL" >> .env.production.local; fi
          if [ -n "$KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=$KEY" >> .env.production.local; fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
